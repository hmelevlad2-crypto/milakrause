<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="moreworks_title">Все работы — Людмила Краусе</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="images/logo.jpg" alt="Logo" class="logo-img" id="logoImg" onerror="this.style.display='none'">
                <span class="logo-text" data-i18n="logo">Мила Краузе</span>
            </a>
            <nav class="nav" id="nav">
                <a href="index.html#about" data-i18n="nav_about">Обо мне</a>
                <a href="index.html#services" data-i18n="nav_services">Услуги</a>
                <a href="#" class="active" data-i18n="nav_gallery">Галерея</a>
                <a href="index.html#contact" data-i18n="nav_contact">Контакты</a>
            </nav>
            <div class="header-right">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <div class="lang-dropdown">
                    <button type="button" class="lang-switch" id="langSwitch">
                        <span class="lang-current" id="langCurrent">RU</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="lang-menu" id="langMenu">
                        <button type="button" class="lang-option" data-lang="ru">🇷🇺 Русский</button>
                        <button type="button" class="lang-option" data-lang="de">🇩🇪 Deutsch</button>
                    </div>
                </div>
                <a href="index.html#contact" class="btn btn-small btn-header" data-i18n="btn_contact">Связаться</a>
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="Меню">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- More Works Gallery -->
    <section class="moreworks-section">
        <div class="moreworks-blob"></div>
        <div class="container">
            <div class="section-header">
                <span class="section-label" data-i18n="gallery_label">Портфолио</span>
                <h1 class="section-title" data-i18n="moreworks_heading">Все работы</h1>
                <p class="section-subtitle" data-i18n="moreworks_subtitle">Полная коллекция работ и ученических проектов</p>
            </div>
            <div class="gallery-tabs-wrap" id="moreworksTabsWrap"></div>
            <div class="moreworks-grid" id="moreworksGrid"></div>
            <div class="moreworks-empty" id="moreworksEmpty">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                <p data-i18n="moreworks_empty">Пока нет загруженных работ</p>
                <a href="admin.html" class="btn btn-primary" data-i18n="moreworks_admin">Загрузить работы</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <p data-i18n="footer_text">© 2026 Людмила Краусе. Все права защищены.</p>
                <div class="footer-socials">
                    <a href="https://t.me/milakrause_neuro" target="_blank" class="footer-social" aria-label="Telegram">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                    </a>
                    <a href="https://youtube.com/@mila-blogerscha-na-velike?si=p_dONf7LQTGXQcqg" target="_blank" class="footer-social" aria-label="YouTube">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
